name: Update and deploy homepage

on:
  schedule:
    # 07:17 Asia/Shanghai, the following day relative to UTC.
    - cron: '17 23 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-pages
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.repository == 'Untergang1/Untergang1.github.io' && github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Refresh scheduled workflow enablement
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/enable"

  build:
    if: github.repository == 'Untergang1/Untergang1.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test page source, snapshot generation and page behavior
        run: |
          python -m unittest discover -s tests -v
          node --test tests/page.test.cjs
      - name: Build site with complete project snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy complete snapshot
        id: deployment
        uses: actions/deploy-pages@v4
